<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AIDO</title>
<style>
  :root {
    --bg: #101014;
    --bg-soft: #16161e;
    --surface: rgba(26, 27, 38, 0.72);
    --surface-solid: #1a1b26;
    --border: rgba(192, 202, 245, 0.08);
    --border-strong: rgba(192, 202, 245, 0.16);
    --fg: #c0caf5;
    --fg-dim: #565f89;
    --fg-bright: #a9b1d6;
    --accent: #7aa2f7;
    --accent-2: #bb9af7;
    --green: #9ece6a;
    --yellow: #e0af68;
    --red: #f7768e;
    --cyan: #7dcfff;
    --radius: 14px;
    --radius-sm: 9px;
    --font: -apple-system, "SF Pro Text", "Inter", "Cantarell", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", "SF Mono", "Fira Code", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: radial-gradient(1200px 700px at 70% -10%, rgba(122, 162, 247, 0.10), transparent 60%),
                radial-gradient(900px 600px at 0% 110%, rgba(187, 154, 247, 0.08), transparent 55%),
                var(--bg);
    color: var(--fg);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    user-select: none;
  }

  #app { display: flex; height: 100vh; }

  /* ── Sidebar ── */
  aside {
    width: 236px; flex: none;
    display: flex; flex-direction: column;
    background: var(--surface);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border-right: 1px solid var(--border);
    padding: 16px 12px;
    gap: 4px;
  }
  .traffic { display: flex; gap: 8px; padding: 6px 8px 16px; }
  .traffic span { width: 12px; height: 12px; border-radius: 50%; }
  .traffic .r { background: #ff5f57; }
  .traffic .y { background: #febc2e; }
  .traffic .g { background: #28c840; }
  .brand {
    font-size: 15px; font-weight: 700; letter-spacing: 0.2px;
    padding: 2px 10px 14px;
  }
  .brand .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--green); margin-right: 8px;
    box-shadow: 0 0 8px rgba(158, 206, 106, 0.7);
  }
  .nav-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 9px 12px;
    background: transparent; border: none; border-radius: var(--radius-sm);
    color: var(--fg-bright); font: inherit; font-size: 13.5px;
    cursor: pointer; text-align: left;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .nav-btn:hover { background: rgba(122, 162, 247, 0.10); color: var(--fg); }
  .nav-btn.active { background: rgba(122, 162, 247, 0.14); color: var(--fg); }
  .nav-btn svg { width: 16px; height: 16px; opacity: 0.85; }
  .nav-sep { height: 1px; background: var(--border); margin: 10px 6px; }
  .side-foot {
    margin-top: auto; padding: 12px 10px 2px;
    font-size: 11.5px; color: var(--fg-dim); line-height: 1.7;
    border-top: 1px solid var(--border);
  }
  .side-foot .model { color: var(--fg-bright); font-family: var(--mono); font-size: 11px; }

  /* ── Main ── */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px 10px;
    font-size: 13px; color: var(--fg-dim);
    border-bottom: 1px solid var(--border);
  }
  header .title { color: var(--fg); font-weight: 600; }
  .badge {
    font-family: var(--mono); font-size: 11px;
    background: rgba(122, 162, 247, 0.12); color: var(--fg-bright);
    border: 1px solid var(--border-strong);
    padding: 3px 10px; border-radius: 99px;
  }

  #chat {
    flex: 1; overflow-y: auto; padding: 22px 22px 10px;
    display: flex; flex-direction: column; gap: 14px;
  }
  #chat::-webkit-scrollbar { width: 9px; }
  #chat::-webkit-scrollbar-thumb { background: rgba(192, 202, 245, 0.14); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
  #chat::-webkit-scrollbar-thumb:hover { background: rgba(192, 202, 245, 0.24); background-clip: padding-box; }

  .msg { display: flex; gap: 12px; max-width: 820px; animation: rise 0.22s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    width: 30px; height: 30px; flex: none; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; letter-spacing: 0.5px;
  }
  .msg.assistant .avatar { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #101014; }
  .msg.user .avatar { background: rgba(192, 202, 245, 0.12); color: var(--fg); }
  .bubble {
    padding: 11px 15px; border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    backdrop-filter: blur(16px);
    line-height: 1.6; user-select: text;
    overflow-wrap: anywhere;
  }
  .msg.user .bubble { background: linear-gradient(135deg, rgba(122,162,247,0.20), rgba(187,154,247,0.16)); border-color: rgba(122, 162, 247, 0.22); }
  .bubble p { margin: 6px 0; }
  .bubble p:first-child { margin-top: 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul { margin: 6px 0 6px 18px; }
  .bubble code.inline {
    font-family: var(--mono); font-size: 12.5px;
    background: rgba(122, 162, 247, 0.12); border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 6px;
  }
  .bubble .caret { display: inline-block; width: 7px; height: 15px; background: var(--accent); vertical-align: -2px; margin-left: 2px; animation: blink 0.9s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .codecard {
    margin: 10px 0; border-radius: var(--radius-sm); overflow: hidden;
    border: 1px solid var(--border-strong);
    background: rgba(16, 16, 20, 0.9);
  }
  .codecard .bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 12px; background: rgba(192, 202, 245, 0.05);
    font-family: var(--mono); font-size: 11px; color: var(--fg-dim);
  }
  .codecard pre {
    padding: 12px 14px; overflow-x: auto;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.55;
    color: var(--fg); white-space: pre-wrap; user-select: text;
  }
  .codecard .result {
    border-top: 1px solid var(--border);
    padding: 10px 14px; font-family: var(--mono); font-size: 12px;
    color: var(--fg-bright); white-space: pre-wrap; user-select: text;
    max-height: 220px; overflow-y: auto;
  }
  .codecard .result.err { color: var(--red); }
  .run-btn {
    border: none; border-radius: 6px; cursor: pointer;
    font: 600 11.5px var(--font); padding: 4px 12px;
    background: rgba(158, 206, 106, 0.16); color: var(--green);
    border: 1px solid rgba(158, 206, 106, 0.3);
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .run-btn:hover { background: rgba(158, 206, 106, 0.26); }
  .run-btn:active { transform: scale(0.97); }
  .run-btn.danger { background: rgba(247, 118, 142, 0.14); color: var(--red); border-color: rgba(247, 118, 142, 0.32); }

  /* ── Composer ── */
  #composer {
    flex: none; padding: 14px 22px 20px;
  }
  .composer-box {
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 18px;
    padding: 10px 12px;
    backdrop-filter: blur(24px);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .composer-box:focus-within { border-color: rgba(122, 162, 247, 0.45); box-shadow: 0 0 0 4px rgba(122, 162, 247, 0.08); }
  textarea {
    flex: 1; resize: none; border: none; outline: none;
    background: transparent; color: var(--fg);
    font: 14px/1.55 var(--font);
    max-height: 140px; padding: 4px 6px;
  }
  textarea::placeholder { color: var(--fg-dim); }
  #send {
    flex: none; border: none; cursor: pointer;
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #101014; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.12s ease, opacity 0.15s ease, filter 0.15s ease;
  }
  #send:hover { filter: brightness(1.08); }
  #send:active { transform: scale(0.94); }
  #send:disabled { opacity: 0.45; cursor: default; }

  /* ── Modals ── */
  .overlay {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(10, 10, 14, 0.55);
    backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
  }
  .overlay.open { display: flex; }
  .modal {
    width: min(560px, 92vw); max-height: 84vh; overflow-y: auto;
    background: var(--surface-solid);
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    padding: 22px 24px;
    animation: rise 0.2s ease;
  }
  .modal h2 { font-size: 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .modal label { display: block; font-size: 12px; color: var(--fg-dim); margin: 14px 0 6px; }
  .modal input, .modal select, .modal textarea {
    width: 100%; padding: 9px 12px;
    background: rgba(16, 16, 20, 0.7);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    color: var(--fg); font: 13.5px var(--font); outline: none;
  }
  .modal input:focus, .modal select:focus { border-color: rgba(122, 162, 247, 0.5); }
  .modal .row { display: flex; gap: 10px; }
  .modal .row > div { flex: 1; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .btn {
    padding: 8px 18px; border-radius: 9px; border: 1px solid var(--border-strong);
    background: rgba(192, 202, 245, 0.06); color: var(--fg);
    font: 600 13px var(--font); cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn:hover { background: rgba(192, 202, 245, 0.12); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; color: #101014; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { background: rgba(247, 118, 142, 0.14); border-color: rgba(247, 118, 142, 0.35); color: var(--red); }
  .hint { font-size: 12px; color: var(--fg-dim); margin-top: 6px; line-height: 1.5; }
  details.locked { margin-top: 18px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
  details.locked summary { cursor: pointer; font-size: 12.5px; color: var(--fg-bright); }
  details.locked textarea {
    margin-top: 10px; min-height: 180px; font-family: var(--mono); font-size: 12px;
    color: var(--fg-dim); resize: vertical;
  }
  .log-entry { padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .log-entry .cmd { font-family: var(--mono); color: var(--fg-bright); user-select: text; }
  .log-entry .meta { color: var(--fg-dim); font-size: 11px; margin-top: 3px; }
  .win-pre {
    background: rgba(16, 16, 20, 0.7); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.55;
    color: var(--fg-bright); white-space: pre-wrap; user-select: text;
    max-height: 420px; overflow-y: auto;
  }
  .field-badge { font-family: var(--mono); font-size: 11px; color: var(--fg-dim); }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="traffic"><span class="r"></span><span class="y"></span><span class="g"></span></div>
    <div class="brand"><span class="dot" id="conn-dot"></span>AIDO</div>
    <button class="nav-btn active" id="btn-new">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg>
      New Chat
    </button>
    <button class="nav-btn" id="btn-settings">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.6v1.8M8 12.6v1.8M1.6 8h1.8M12.6 8h1.8M3.5 3.5l1.3 1.3M11.2 11.2l1.3 1.3M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3"/></svg>
      Settings
    </button>
    <button class="nav-btn" id="btn-desktop">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M5.5 14h5M8 11.5V14"/></svg>
      Desktop
    </button>
    <button class="nav-btn" id="btn-log">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 2h8v12H4zM7 5.5h4M7 8h4M7 10.5h4"/></svg>
      Command Log
    </button>
    <div class="nav-sep"></div>
    <div class="side-foot">
      <div id="status-line">Connecting…</div>
      <div class="model" id="model-line"></div>
    </div>
  </aside>

  <main>
    <header>
      <span class="title">AIDO</span>
      <span class="badge" id="provider-badge">—</span>
    </header>
    <div id="chat"></div>
    <div id="composer">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="Ask AIDO anything — it has full access to this computer"></textarea>
        <button id="send" title="Send">↑</button>
      </div>
    </div>
  </main>
</div>

<!-- Settings -->
<div class="overlay" id="ov-settings">
  <div class="modal">
    <h2>Settings</h2>
    <label>Provider</label>
    <select id="set-provider"></select>
    <label>API Key</label>
    <input id="set-apikey" type="password" placeholder="sk-…" autocomplete="off">
    <label>Base URL <span class="field-badge">(custom providers)</span></label>
    <input id="set-baseurl" type="text" placeholder="http://localhost:11434/v1">
    <label>Model</label>
    <input id="set-model" list="model-list" type="text" placeholder="model name">
    <datalist id="model-list"></datalist>
    <div class="hint">Any OpenAI-compatible endpoint works: Ollama, LM Studio, OpenRouter, vLLM, and more.</div>
    <details class="locked">
      <summary>System prompt (locked by PromptLix OS)</summary>
      <textarea id="set-sysprompt" readonly></textarea>
    </details>
    <div class="actions">
      <button class="btn" id="set-cancel">Cancel</button>
      <button class="btn primary" id="set-save">Save</button>
    </div>
  </div>
</div>

<!-- Run confirm -->
<div class="overlay" id="ov-confirm">
  <div class="modal">
    <h2 id="cf-title">Run command?</h2>
    <div class="win-pre" id="cf-command"></div>
    <div class="hint" id="cf-note"></div>
    <div class="actions">
      <button class="btn" id="cf-cancel">Cancel</button>
      <button class="btn primary" id="cf-run">Run</button>
    </div>
  </div>
</div>

<!-- Command log -->
<div class="overlay" id="ov-log">
  <div class="modal">
    <h2>Command Log</h2>
    <div id="log-body"></div>
    <div class="actions">
      <button class="btn" id="log-close">Close</button>
    </div>
  </div>
</div>

<!-- Desktop -->
<div class="overlay" id="ov-desktop">
  <div class="modal">
    <h2>Desktop state <span class="field-badge">windows.jsonc — what the AI sees</span></h2>
    <div class="win-pre" id="desktop-body">Loading…</div>
    <div class="actions">
      <button class="btn" id="desktop-close">Close</button>
    </div>
  </div>
</div>

<script>
(function () {
  const qs = new URLSearchParams(location.search);
  let TOKEN = qs.get("token") || localStorage.getItem("promptlix-token") || "";
  if (TOKEN) localStorage.setItem("promptlix-token", TOKEN);

  const DANGER = ["rm -rf /","rm -rf /*","mkfs.","dd if=","> /dev/sd","chmod 777 /",":(){","--no-preserve-root","fdisk","parted","shutdown","reboot","systemctl poweroff","format c:","diskutil erase"];

  const $ = (id) => document.getElementById(id);
  const chat = $("chat"), input = $("input"), send = $("send");

  let conversation = [];
  let cfg = { provider: "anthropic", model: "", providers: {} };
  let streaming = false;
  let pendingRender = null;

  async function api(path, opts = {}) {
    const headers = Object.assign({ "X-Promptlix-Token": TOKEN }, opts.headers || {});
    const res = await fetch(path, Object.assign({}, opts, { headers }));
    if (res.status === 401) throw new Error("Unauthorized — token mismatch");
    return res;
  }

  /* ── Markdown-lite rendering ── */
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function inline(s) {
    return escapeHtml(s)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
  }
  function isDanger(cmd) {
    const c = cmd.toLowerCase();
    return DANGER.some((k) => c.includes(k));
  }
  function codeCard(code, lang) {
    const card = document.createElement("div");
    card.className = "codecard";
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.innerHTML = "<span>" + escapeHtml(lang || "code") + "</span>";
    const run = document.createElement("button");
    run.className = "run-btn" + (isDanger(code) ? " danger" : "");
    run.textContent = "Run";
    run.onclick = () => confirmRun(code, run, card);
    bar.appendChild(run);
    const pre = document.createElement("pre");
    pre.textContent = code;
    card.appendChild(bar);
    card.appendChild(pre);
    return card;
  }
  function renderText(text) {
    const frag = document.createDocumentFragment();
    const parts = text.split(/```(\w*)\n?([\s\S]*?)(?:```|$)/g);
    for (let i = 0; i < parts.length; i++) {
      if (i % 3 === 2) {
        frag.appendChild(codeCard(parts[i].replace(/\n$/, ""), parts[i - 1] || "bash"));
      } else if (i % 3 === 0 && parts[i]) {
        const div = document.createElement("div");
        const lines = parts[i].split("\n");
        let html = "";
        for (const line of lines) {
          const t = line.trim();
          if (/^[-*] /.test(t)) html += "<li>" + inline(t.slice(2)) + "</li>";
          else if (t) html += "<p>" + inline(line) + "</p>";
        }
        if (html.includes("<li>") && !html.includes("</p>")) html = "<ul>" + html + "</ul>";
        div.innerHTML = html;
        frag.appendChild(div);
      }
    }
    return frag;
  }

  /* ── Messages ── */
  function addMessage(role, text) {
    const msg = document.createElement("div");
    msg.className = "msg " + role;
    const av = document.createElement("div");
    av.className = "avatar";
    av.textContent = role === "user" ? "U" : "A";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    msg.appendChild(av);
    msg.appendChild(bubble);
    chat.appendChild(msg);
    if (text) bubble.appendChild(renderText(text));
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }
  function welcome() {
    addMessage("assistant",
      "**Welcome to AIDO.** I'm your system assistant with full access to this computer.\n\n" +
      "- I can run shell commands, manage files and packages, and control the desktop\n" +
      "- I see your open windows live (positions, sizes, fullscreen state)\n" +
      "- Suggest commands and I'll show Run buttons you approve\n\n" +
      "What would you like to do?");
  }

  /* ── Chat flow ── */
  function setStreaming(v) {
    streaming = v;
    send.disabled = v;
  }
  function scheduleRender(bubble, text) {
    if (pendingRender) cancelAnimationFrame(pendingRender);
    pendingRender = requestAnimationFrame(() => {
      bubble.innerHTML = "";
      bubble.appendChild(renderText(text));
      const caret = document.createElement("span");
      caret.className = "caret";
      bubble.appendChild(caret);
      chat.scrollTop = chat.scrollHeight;
    });
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || streaming) return;
    input.value = "";
    conversation.push({ role: "user", content: text });
    addMessage("user", text);
    const bubble = addMessage("assistant");
    setStreaming(true);

    let full = "";
    try {
      const res = await api("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: conversation, provider: cfg.provider, model: cfg.model })
      });
      if (!res.ok) {
        const j = await res.json().catch(() => ({}));
        bubble.appendChild(renderText("**Error:** " + (j.error || res.statusText)));
        return;
      }
      const ct = res.headers.get("Content-Type") || "";
      if (!ct.includes("text/event-stream")) {
        const j = await res.json().catch(() => ({}));
        bubble.appendChild(renderText("**Error:** " + (j.error || "unexpected response")));
        return;
      }
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) !== -1) {
          const chunk = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          for (const line of chunk.split("\n")) {
            if (!line.startsWith("data: ")) continue;
            const payload = line.slice(6);
            if (payload === "[DONE]") continue;
            let obj = null;
            try { obj = JSON.parse(payload); } catch (e) { continue; }
            if (obj.delta) { full += obj.delta; scheduleRender(bubble, full); }
            if (obj.error) { full += "\n\n**Error:** " + obj.error; scheduleRender(bubble, full); }
          }
        }
      }
    } catch (e) {
      full += "\n\n**Error:** " + e.message;
    } finally {
      bubble.innerHTML = "";
      bubble.appendChild(renderText(full || "*(no response)*"));
      chat.scrollTop = chat.scrollHeight;
      conversation.push({ role: "assistant", content: full });
      setStreaming(false);
    }
  }

  /* ── Run commands ── */
  let pendingCommand = null;
  function confirmRun(code, btn, card) {
    pendingCommand = { code, btn, card };
    $("cf-command").textContent = code;
    const danger = isDanger(code);
    $("cf-title").textContent = danger ? "Potentially dangerous command" : "Run command?";
    $("cf-note").textContent = danger
      ? "This command matches dangerous patterns. It will run with your user privileges. Proceed only if you fully trust it."
      : "This command will run on your computer with your user privileges.";
    $("cf-run").className = "btn " + (danger ? "danger" : "primary");
    $("ov-confirm").classList.add("open");
  }
  async function runCommand() {
    if (!pendingCommand) return;
    const { code, card } = pendingCommand;
    $("ov-confirm").classList.remove("open");
    const result = document.createElement("div");
    result.className = "result";
    result.textContent = "Running…";
    card.appendChild(result);
    try {
      const res = await api("/api/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ command: code })
      });
      const j = await res.json();
      result.textContent = j.error
        ? j.error
        : (j.stdout || "") + (j.stderr ? "\n" + j.stderr : "") ||
          ("exit code " + j.returncode);
      if (j.error || j.returncode !== 0) result.classList.add("err");
    } catch (e) {
      result.textContent = "Error: " + e.message;
      result.classList.add("err");
    }
    pendingCommand = null;
  }

  /* ── Settings ── */
  async function loadSettings() {
    const sel = $("set-provider");
    sel.innerHTML = "";
    for (const [key, info] of Object.entries(cfg.providers)) {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = info.name;
      sel.appendChild(opt);
    }
    sel.value = cfg.provider;
    $("set-apikey").value = cfg.api_key || "";
    $("set-baseurl").value = cfg.base_url || (cfg.providers[cfg.provider] && cfg.providers[cfg.provider].base_url) || "";
    $("set-model").value = cfg.model || "";
    fillModels();
    try {
      const res = await api("/api/system-prompt");
      const j = await res.json();
      $("set-sysprompt").value = j.system_prompt;
    } catch (e) { /* ignore */ }
  }
  function fillModels() {
    const dl = $("model-list");
    dl.innerHTML = "";
    const p = cfg.providers[cfg.provider];
    if (p && p.models) {
      for (const m of p.models) {
        const opt = document.createElement("option");
        opt.value = m;
        dl.appendChild(opt);
      }
    }
  }

  /* ── Panels ── */
  async function openLog() {
    $("ov-log").classList.add("open");
    const body = $("log-body");
    body.innerHTML = "";
    try {
      const res = await api("/api/log");
      const entries = await res.json();
      if (!entries.length) body.innerHTML = '<div class="hint">No commands run yet.</div>';
      for (const e of entries.slice().reverse()) {
        const div = document.createElement("div");
        div.className = "log-entry";
        div.innerHTML = '<div class="cmd">$ ' + escapeHtml(e.command) + '</div>' +
          '<div class="meta">' + escapeHtml(e.timestamp || "") + " — " +
          (e.approved === false ? "blocked" : "exit " + e.returncode) + "</div>";
        body.appendChild(div);
      }
    } catch (e) {
      body.innerHTML = '<div class="hint">' + e.message + "</div>";
    }
  }
  async function openDesktop() {
    $("ov-desktop").classList.add("open");
    try {
      const res = await api("/api/windows");
      const j = await res.json();
      $("desktop-body").textContent = j.windows || "(window tracking unavailable — is an X11 session running?)";
    } catch (e) {
      $("desktop-body").textContent = e.message;
    }
  }

  /* ── Init ── */
  async function refreshStatus() {
    try {
      const res = await api("/api/config");
      cfg = await res.json();
      $("provider-badge").textContent = (cfg.providers[cfg.provider] || {}).name + " · " + cfg.model;
      $("model-line").textContent = cfg.model;
      $("status-line").textContent = "Connected — full system access";
      $("conn-dot").style.background = "var(--green)";
    } catch (e) {
      $("status-line").textContent = "Offline — " + e.message;
      $("conn-dot").style.background = "var(--red)";
    }
  }

  send.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });

  $("btn-new").onclick = () => { conversation = []; chat.innerHTML = ""; welcome(); };
  $("btn-settings").onclick = async () => { await loadSettings(); $("ov-settings").classList.add("open"); };
  $("set-cancel").onclick = () => $("ov-settings").classList.remove("open");
  $("set-provider").onchange = fillModels;
  $("set-save").onclick = async () => {
    const body = {
      provider: $("set-provider").value,
      api_key: $("set-apikey").value.trim(),
      base_url: $("set-baseurl").value.trim(),
      model: $("set-model").value.trim(),
    };
    try {
      await api("/api/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      $("ov-settings").classList.remove("open");
      await refreshStatus();
    } catch (e) {
      alert("Could not save settings: " + e.message);
    }
  };

  $("btn-log").onclick = openLog;
  $("log-close").onclick = () => $("ov-log").classList.remove("open");
  $("btn-desktop").onclick = openDesktop;
  $("desktop-close").onclick = () => $("ov-desktop").classList.remove("open");

  $("cf-cancel").onclick = () => { pendingCommand = null; $("ov-confirm").classList.remove("open"); };
  $("cf-run").onclick = runCommand;

  document.querySelectorAll(".overlay").forEach((ov) => {
    ov.addEventListener("mousedown", (e) => { if (e.target === ov) ov.classList.remove("open"); });
  });

  welcome();
  refreshStatus();
})();
</script>
</body>
</html>
