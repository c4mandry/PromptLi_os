general {
    colors = true
    color_good = "#9ece6a"
    color_bad = "#f7768e"
    color_degraded = "#e0af68"
    interval = 5
}

order += "disk /"
order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "load"
order += "memory"
order += "tztime local"

wireless _first_ {
    format_up = "W: %quality %essid"
    format_down = "W: down"
}

ethernet _first_ {
    format_up = "E: %ip"
    format_down = "E: down"
}

battery all {
    format = "%status %percentage %remaining"
}

disk "/" {
    format = "💾 %avail"
}

load {
    format = "⚡ %1min"
}

memory {
    format = "🧠 %used/%total"
}

tztime local {
    format = "📅 %Y-%m-%d %H:%M"
}
